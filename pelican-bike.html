<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自行车在骑鹈鹕</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #6ec8f2;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .caption {
      position: fixed;
      left: 28px;
      top: 20px;
      color: #14324a;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      pointer-events: none;
      z-index: 2;
    }
    .caption h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 760;
      letter-spacing: 0.04em;
    }
    .caption p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.78;
    }
    .travel {
      animation: cross 12s linear infinite;
    }
    .bob {
      animation: bob 1.45s ease-in-out infinite;
    }
    .shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shade 1.45s ease-in-out infinite;
    }
    @keyframes cross {
      from { transform: translate(-720px, 246px); }
      to { transform: translate(1320px, 246px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1.2deg); }
      50% { transform: translateY(-24px) rotate(1.4deg); }
    }
    @keyframes shade {
      0%, 100% { transform: scaleX(1); opacity: 0.28; }
      50% { transform: scaleX(0.72); opacity: 0.12; }
    }
  </style>
</head>
<body>
  <svg class="stage" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一辆红色自行车骑在飞翔的鹈鹕背上">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#67c4f6" />
        <stop offset="58%" stop-color="#c5ecfd" />
        <stop offset="100%" stop-color="#eef9ff" />
      </linearGradient>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#49addf" />
        <stop offset="100%" stop-color="#145f96" />
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe08a" />
        <stop offset="100%" stop-color="#f0a202" />
      </linearGradient>
      <radialGradient id="sun" cx="42%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#fff8d6" />
        <stop offset="55%" stop-color="#ffd15c" />
        <stop offset="100%" stop-color="#ffb703" />
      </radialGradient>
    </defs>

    <rect width="1200" height="675" fill="url(#sky)" />

    <g transform="translate(150 108)">
      <g stroke="#ffe29a" stroke-width="5" stroke-linecap="round" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite" />
        <line x1="0" y1="-78" x2="0" y2="-60" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(45)" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(90)" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(135)" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(180)" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(225)" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(270)" />
        <line x1="0" y1="-78" x2="0" y2="-60" transform="rotate(315)" />
      </g>
      <circle r="48" fill="url(#sun)" />
    </g>

    <g fill="#ffffff">
      <g>
        <animateTransform attributeName="transform" type="translate" from="1400 86" to="-520 86" dur="52s" repeatCount="indefinite" />
        <ellipse cx="0" cy="18" rx="54" ry="22" opacity="0.92" />
        <ellipse cx="42" cy="10" rx="36" ry="24" />
        <ellipse cx="-36" cy="16" rx="30" ry="18" />
        <ellipse cx="16" cy="-2" rx="28" ry="20" />
      </g>
      <g opacity="0.9">
        <animateTransform attributeName="transform" type="translate" from="1600 168" to="-480 168" dur="74s" repeatCount="indefinite" />
        <ellipse cx="0" cy="20" rx="70" ry="24" />
        <ellipse cx="48" cy="8" rx="40" ry="26" />
        <ellipse cx="-50" cy="14" rx="34" ry="20" />
      </g>
      <g opacity="0.82">
        <animateTransform attributeName="transform" type="translate" from="1100 46" to="-400 46" dur="40s" repeatCount="indefinite" />
        <ellipse cx="0" cy="12" rx="36" ry="14" />
        <ellipse cx="26" cy="6" rx="22" ry="14" />
        <ellipse cx="-24" cy="10" rx="18" ry="12" />
      </g>
    </g>

    <g fill="none" stroke="#1d4d6e" stroke-width="2.2" stroke-linecap="round" opacity="0.4">
      <g>
        <animateTransform attributeName="transform" type="translate" from="1300 210" to="-200 180" dur="28s" repeatCount="indefinite" />
        <path d="M0 0 q10 8 20 0" />
        <path d="M28 -8 q8 7 16 0" />
      </g>
    </g>

    <path d="M0 470 C 140 430 220 500 360 470 C 520 434 620 512 820 468 C 980 434 1080 490 1200 450 L 1200 530 L 0 530 Z" fill="#8ed18a" />
    <path d="M0 508 C 180 486 260 528 460 506 C 690 480 860 530 1200 500 L 1200 675 L 0 675 Z" fill="url(#water)" />

    <g fill="#2f8a45" opacity="0.9">
      <path d="M70 512 l 8 -28 l 8 28 z" />
      <path d="M86 516 l 6 -20 l 7 20 z" />
      <path d="M1040 504 l 9 -32 l 9 32 z" />
      <path d="M1060 508 l 6 -18 l 7 18 z" />
    </g>

    <g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round">
      <path d="M-20 560 q 30 -16 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0" stroke-dasharray="8 14">
        <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="2.6s" repeatCount="indefinite" />
      </path>
      <path d="M-20 602 q 36 -14 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0" opacity="0.7" />
    </g>

    <g class="travel">
      <ellipse class="shadow" cx="270" cy="268" rx="138" ry="16" fill="#08344e" />
      <g class="bob">
        <!-- 后翅 -->
        <g transform="translate(176 146)" fill="#e7eef5" stroke="#24303a" stroke-width="3" stroke-linejoin="round">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="18;-42;18" dur="0.82s" repeatCount="indefinite" />
            <path d="M10 12 C -24 -8 -36 -78 -112 -96 C -158 -106 -176 -62 -154 -28 C -122 12 -28 42 12 22 Z" />
            <path d="M-108 -90 C -150 -100 -172 -64 -150 -34 C -160 -58 -140 -88 -104 -80 Z" fill="#24303a" stroke="none" />
          </g>
        </g>

        <path d="M134 142 C 74 112 46 156 78 190 C 42 206 102 214 146 186 C 156 170 150 152 134 142 Z" fill="#f7fbff" stroke="#24303a" stroke-width="3" stroke-linejoin="round" />

        <ellipse cx="236" cy="156" rx="112" ry="56" fill="#fffaf4" stroke="#24303a" stroke-width="3" />
        <ellipse cx="256" cy="170" rx="72" ry="32" fill="#ffffff" opacity="0.7" />

        <!-- 脚 -->
        <g transform="translate(196 202)" fill="#ef7b2f" stroke="#9a4512" stroke-width="2" stroke-linejoin="round">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="26;-32;26" dur="0.5s" repeatCount="indefinite" />
            <path d="M0 0 L 6 34 L -18 46 L 2 40 L 10 52 L 16 38 Z" />
          </g>
        </g>
        <g transform="translate(252 206)" fill="#ef7b2f" stroke="#9a4512" stroke-width="2" stroke-linejoin="round">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="26;-32;26" dur="0.5s" begin="-0.25s" repeatCount="indefinite" />
            <path d="M0 0 L 6 34 L -18 46 L 2 40 L 10 52 L 16 38 Z" />
          </g>
        </g>

        <!-- 前翅 -->
        <g transform="translate(214 136)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="16;-40;16" dur="0.82s" repeatCount="indefinite" />
            <path d="M12 14 C -34 -24 -18 -108 -108 -128 C -168 -142 -190 -84 -156 -36 C -112 16 -16 46 14 24 Z" fill="#ffffff" stroke="#24303a" stroke-width="3" stroke-linejoin="round" />
            <path d="M-102 -122 C -156 -136 -186 -86 -154 -42 C -166 -78 -140 -118 -96 -110 Z" fill="#24303a" />
            <g fill="none" stroke="#24303a" stroke-width="2" opacity="0.45">
              <path d="M-20 -20 C -70 -40 -90 -8 -40 10" />
              <path d="M-8 0 C -58 -8 -78 24 -28 34" />
            </g>
          </g>
        </g>

        <!-- 自行车骑在背上 -->
        <g fill="none" stroke="#e31c3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M150 96 L 198 112 L 176 62 Z" />
          <path d="M176 62 L 250 50 L 198 112" />
          <path d="M250 50 L 270 86" />
        </g>
        <g transform="translate(150 96)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.5s" repeatCount="indefinite" />
            <circle r="31" fill="#fffaf4" stroke="#1c1e27" stroke-width="8" />
            <circle r="20" fill="none" stroke="#c5ced8" stroke-width="3" />
            <g stroke="#8e99a6" stroke-width="2">
              <line x1="-18" y1="0" x2="18" y2="0" />
              <line x1="0" y1="-18" x2="0" y2="18" />
              <line x1="-13" y1="-13" x2="13" y2="13" />
              <line x1="-13" y1="13" x2="13" y2="-13" />
            </g>
            <circle r="4.5" fill="#fff" stroke="#1c1e27" stroke-width="2" />
          </g>
        </g>
        <g transform="translate(270 86)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.5s" repeatCount="indefinite" />
            <circle r="31" fill="#fffaf4" stroke="#1c1e27" stroke-width="8" />
            <circle r="20" fill="none" stroke="#c5ced8" stroke-width="3" />
            <g stroke="#8e99a6" stroke-width="2">
              <line x1="-18" y1="0" x2="18" y2="0" />
              <line x1="0" y1="-18" x2="0" y2="18" />
              <line x1="-13" y1="-13" x2="13" y2="13" />
              <line x1="-13" y1="13" x2="13" y2="-13" />
            </g>
            <circle r="4.5" fill="#fff" stroke="#1c1e27" stroke-width="2" />
          </g>
        </g>
        <circle cx="198" cy="112" r="11" fill="none" stroke="#24303a" stroke-width="4" />
        <g transform="translate(198 112)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.5s" repeatCount="indefinite" />
            <line x1="0" y1="-18" x2="0" y2="18" stroke="#24303a" stroke-width="4" stroke-linecap="round" />
            <g transform="translate(0 -18)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.5s" repeatCount="indefinite" />
                <rect x="-8" y="-3.2" width="16" height="6.4" rx="1.5" fill="#1c1e27" />
              </g>
            </g>
            <g transform="translate(0 18)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.5s" repeatCount="indefinite" />
                <rect x="-8" y="-3.2" width="16" height="6.4" rx="1.5" fill="#1c1e27" />
              </g>
            </g>
          </g>
        </g>
        <g transform="translate(168 54) rotate(-12)">
          <ellipse cx="0" cy="0" rx="18" ry="6" fill="#2b2d42" />
        </g>
        <path d="M250 50 C 262 28 286 26 288 42" fill="none" stroke="#24303a" stroke-width="4" stroke-linecap="round" />
        <circle cx="286" cy="34" r="4" fill="#ffd166" stroke="#24303a" stroke-width="2" />
        <path d="M168 96 Q 182 108 196 104" fill="none" stroke="#24303a" stroke-width="2" opacity="0.7" />

        <!-- 脖子、头、大嘴 -->
        <g transform="translate(322 150)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="7;-9;7" dur="1.45s" repeatCount="indefinite" />
            <path d="M0 6 C 20 -18 42 -58 66 -80" fill="none" stroke="#24303a" stroke-width="26" stroke-linecap="round" />
            <path d="M0 6 C 20 -18 42 -58 66 -80" fill="none" stroke="#fffaf4" stroke-width="20" stroke-linecap="round" />
            <circle cx="74" cy="-86" r="22" fill="#fffaf4" stroke="#24303a" stroke-width="3" />
            <path d="M90 -98 C 150 -112 214 -104 246 -90 L 236 -80 C 196 -88 140 -90 92 -84 Z" fill="url(#beak)" stroke="#24303a" stroke-width="3" stroke-linejoin="round" />
            <path d="M90 -82 C 150 -78 210 -86 236 -92 C 206 -58 140 -46 86 -68 Z" fill="#f0782f" stroke="#24303a" stroke-width="3" stroke-linejoin="round" />
            <path d="M232 -90 L 252 -82 L 234 -76 Z" fill="#e09408" stroke="#24303a" stroke-width="2" stroke-linejoin="round" />
            <ellipse cx="78" cy="-92" rx="9" ry="6.5" fill="#f6d36b" />
            <circle cx="82" cy="-93" r="3.4" fill="#1b1d22" />
            <circle cx="83.2" cy="-94.2" r="1.15" fill="#ffffff" />
          </g>
        </g>
      </g>
    </g>
  </svg>
  <div class="caption">
    <h1>自行车在骑鹈鹕</h1>
    <p>没有人。红车子自己踩着踏板，骑在鹈鹕背上飞过水面。</p>
  </div>
</body>
</html>
